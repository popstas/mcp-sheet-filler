version: '3.8'

services:
  mcp-sheet-filler:
    build: .
    ports:
      - "3000:3000"
    environment:
      - TRANSPORT=http
      - PORT=3000
      # Required for Google Sheets backend:
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID}
      # Option 1: Service account authentication
      # - GOOGLE_SERVICE_ACCOUNT_KEY=/secrets/service-account.json
      # Option 2: OAuth authentication
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_TOKEN_PATH=/data/tokens.json
      - AUTH_DB_PATH=/data/auth.db
    volumes:
      # For OAuth token persistence
      - filler-data:/data
      # Uncomment to mount service account key:
      # - ./secrets:/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  filler-data:
